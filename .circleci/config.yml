# Python CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.1/language-python/ for more details
#
version: 2.1
orbs:
  codecov: codecov/codecov@5.4.3
commands:
  record_python_id:
    steps:
      - run:
          name: Record the exact interpreter in this container
          command: |
            # cimg/python:3.X is a MOVING tag: the patch release, and the pyenv
            # directory the interpreter lives in, change underneath us without
            # any change on our side.  A venv bakes that absolute path into
            # .venv/bin/python and into the shebang of every console script, so
            # a venv built against an older patch release is unusable here (it
            # fails as "cannot execute: required file not found", exit 127).
            # Hashing this file into the cache key retires such a cache instead
            # of restoring it.  Cache keys are immutable, so without this the
            # rebuilt venv can never be saved and every run stays broken.
            { python3 -VV; readlink -f "$(command -v python3)"; } | tee .python-id

  setup_environment:
    parameters:
      extras:
        type: string
        default: "test,doc"
    steps:
      - run:
          name: Create or repair the virtualenv
          command: |
            if .venv/bin/python -c "import pytest" > /dev/null 2>&1; then
                echo "Restored environment is usable"
                exit 0
            fi
            echo "No usable environment was restored - building one"
            rm -rf .venv
            (sudo apt-get update || sudo apt-get update) # Robust apt update
            sudo apt-get install -y gfortran libopenblas-dev
            sudo apt-get install -yqq curl gpg
            pip install --upgrade "uv>=0.9"
            uv venv --clear
            source .venv/bin/activate
            uv pip install --upgrade "setuptools>=70"
            uv pip install --upgrade pip
            uv pip install --upgrade distlib
            uv pip install --upgrade pytest
            uv pip install --upgrade numba
            # --torch-backend=cpu is required, not an optimization.  PyPI's
            # default linux torch wheel is the CUDA build, which pulls in triton
            # and ~15 nvidia-* packages.  These runners have no GPU and rapidtide
            # never calls torch.compile, so none of it is used - but it is not
            # harmless: pytest imports every selected module at collection time,
            # and test_dlfilter.py imports tensorflow at module scope, so TF's
            # native stack is already resident when a test builds an optimizer
            # (torch.optim.Adam.__init__ -> torch._compile -> import torch._dynamo
            # -> has_triton_package()).  That lazily imports triton, which
            # segfaults the interpreter - exit 139, killing the whole shard.  The
            # probe is a try/except ImportError, which a segfault sails past.
            # Uninstalling triton afterwards does NOT work: any later
            # "uv pip install ." re-materializes the full dependency graph and
            # brings it back.  The cpu wheel never resolves it in the first place.
            # Every "uv pip install ." below must carry this flag for the same
            # reason.
            uv pip install --torch-backend=cpu ".[<< parameters.extras >>]"

  run_split_pytests:
    parameters:
      timeout:
        type: string
        default: "20m"
      extra_args:
        type: string
        default: ""
    steps:
      - run:
          no_output_timeout: << parameters.timeout >>
          name: Run split pytest suite
          command: |
            source .venv/bin/activate
            pwd
            pushd rapidtide/data/examples/src
            ./installtestdata
            popd
            TESTFILES=$(circleci tests glob rapidtide/tests/test*.py | circleci tests split --split-by=timings)
            mkdir -p rapidtide/tests/test-results
            set +e
            pytest \
              $TESTFILES \
              << parameters.extra_args >> \
              --color=yes \
              --junitxml=rapidtide/tests/test-results/junit.xml
            PYTEST_EXIT=$?
            set -e
            if [ "$PYTEST_EXIT" -eq 5 ]; then
              echo "No tests selected on this shard after filtering; continuing."
              exit 0
            fi
            exit "$PYTEST_EXIT"
jobs:
  build_py310:
    working_directory: /tmp/src/rapidtide
    docker:
      - image: cimg/python:3.10
    resource_class: medium
    steps:
      - checkout
      - persist_to_workspace:
          root: /tmp
          paths:
            - src/rapidtide
      - record_python_id
      - restore_cache: # ensure this step occurs *before* installing dependencies
          key: deps3-310-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
      - setup_environment:
          extras: "tf,test,doc"
      - run: # will overwrite rapidtide installation each time
          name: Install rapidtide
          command: |
            uv pip install --torch-backend=cpu .[tf,test,doc]
      - save_cache: # environment cache tied to requirements
          key: deps3-310-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
          paths:
            - "/tmp/src/rapidtide/.venv"

  build_py311:
