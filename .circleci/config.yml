      - setup_environment:
          extras: "tf,test,doc"
      - run:  # will overwrite rapidtide installation each time
          name: Install rapidtide
          command:  |
            uv pip install --torch-backend=cpu .[tf,test,doc]
      - save_cache:  # environment cache tied to requirements
          key: deps3-311-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
