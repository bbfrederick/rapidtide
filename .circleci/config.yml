  build_docs:
    working_directory: /tmp/src/rapidtide
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - attach_workspace:  # get rapidtide
          at: /tmp
      - record_python_id
      - restore_cache:  # load environment
          key: deps3-311-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
      - setup_environment:
          extras: "doc"
      - run:
          name: Build documentation
          command: |
            sudo apt-get update
            sudo apt-get install -yqq make
            source .venv/bin/activate
            uv pip install --torch-backend=cpu .[doc]
            uv pip uninstall pyqtgraph
            uv pip install numpydoc
            make -C docs html
      - store_artifacts:
          path: /tmp/src/rapidtide/docs/_build/html

  style_check:
    working_directory: /tmp/src/rapidtide
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - attach_workspace:  # get rapidtide
          at: /tmp
      - record_python_id
      - restore_cache:  # load environment
          key: deps3-314-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
      - setup_environment:
          extras: "test,doc"
      - run:
          name: Linting
          command:  |
            source .venv/bin/activate
            uv pip install flake8-black
            flake8 --ignore=E114,E116,E127,E203,E231,E402,E501,E722,F401,F841,W503,W504 /tmp/src/rapidtide/rapidtide
      - store_artifacts:
          path: /tmp/data/lint

workflows:
  version: 2.1
  run_tests:
    jobs:
      - build_py310
      - test_py310:
          requires:
            - build_py310
      - build_py311
      - test_py311:
          requires:
            - build_py311
      - build_py312
      - test_py312:
          requires:
            - build_py312
      - build_py313
      - test_py313:
          requires:
            - build_py313
      - test_py313_with_coverage:
          requires:
            - build_py313
      - test_py313_slow:
          requires:
            - build_py313
      - build_py314
      - test_py314:
          requires:
            - build_py314
      - build_docs:
          requires:
            - build_py311
