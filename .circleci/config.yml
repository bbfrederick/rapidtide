  test_py310:
    working_directory: /tmp/src/rapidtide
    docker:
      - image: cimg/python:3.10
    parallelism: 4
    resource_class: large
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
      MPLCONFIGDIR: "/tmp/mplconfig"
      PYTHONPATH: "/tmp/src/rapidtide"
    steps:
      - checkout
      - attach_workspace:  # get rapidtide
          at: /tmp
      - record_python_id
      - restore_cache:  # load environment
          key: deps3-310-{{ checksum ".python-id" }}-{{ checksum "pyproject.toml" }}-{{ checksum ".circleci/config.yml" }}
      - setup_environment:
          extras: "tf,test,doc"
      - run_split_pytests:
          timeout: "20m"
          extra_args: '-W ignore --ignore=rapidtide/candidatetests -m "not slow"'
      - store_test_results:
          path: rapidtide/tests/test-results
      - store_artifacts:
          path: rapidtide/tests/test-results

